name: ci

# Builds OpenMSDIA's msdia140.dll, the walker and the test corpus (clang
# and MSVC), checks exports and vtable layouts, then walks every corpus PDB
# with the runner's real msdia140.dll (Visual Studio DIA SDK) and with ours
# and reports the match score. PDBs, walker outputs and the score are
# uploaded as artifacts; Microsoft binaries are never uploaded.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  amd64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-llvm-tools
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-zstd
            mingw-w64-clang-x86_64-python
      - name: Locate the DIA SDK
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dll = Join-Path $vs "DIA SDK\bin\amd64\msdia140.dll"
          if (-not (Test-Path $dll)) { throw "not found: $dll" }
          "MSDIA_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VS_PATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Get-Item -LiteralPath $dll).VersionInfo.FileVersion
          "dbghelp: " + (Get-Item -LiteralPath "$env:SystemRoot\System32\dbghelp.dll").VersionInfo.FileVersion
      - name: No high-level LLVM PDB layer in the sources
        run: tools/check_layers.sh
      - name: Generated headers are up to date
        run: |
          python3 tools/gen_dia.py phase0/snapshots/msdia140-14.51.36257.0-amd64/typelib.json --out include/openmsdia
          git diff --exit-code include/
      - name: Build
        run: make -j4 all
      - name: Check exports, vtable layouts and imports
        run: |
          make check
          echo "imports:"; llvm-readobj --coff-imports build/msdia140.dll | sed -n 's/^ *Name: //p' | sort -u
      - name: Build the clang corpus
        run: corpus/build.sh build/corpus
      - name: Build the MSVC corpus
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module (Join-Path $env:VS_PATH 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $env:VS_PATH -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & corpus\build_msvc.ps1 build\corpus
      - name: Build the MSVC x86 corpus
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module (Join-Path $env:VS_PATH 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $env:VS_PATH -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64'
          & corpus\build_msvc.ps1 build\corpus -X86
      - name: Build the PGO corpus (MSVC)
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module (Join-Path $env:VS_PATH 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $env:VS_PATH -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & corpus\pgo\build_pgo.ps1 build\pgo
      - name: Build the name corpus (clang-cl, lld)
        run: corpus/names/build.sh build/names
      - name: Build the MSVC name corpus
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module (Join-Path $env:VS_PATH 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $env:VS_PATH -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & corpus\build_msvc.ps1 build\names -Names
          Enter-VsDevShell -VsInstallPath $env:VS_PATH -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=x64'
          & corpus\build_msvc.ps1 build\names -Names -X86
      - name: Walk the corpus with the real DLL and with ours
        run: |
          real=$(cygpath -u "$MSDIA_DLL")
          walker/run_corpus.sh "$real" build/corpus build/real
          walker/run_corpus.sh "$(cygpath -m build/msdia140.dll)" build/corpus build/ours
      - name: Score
        run: |
          python3 tools/diff_walk.py --dirs build/real build/ours --top 40 \
            --json build/score.json --markdown build/score.md | tee build/score.txt
          cat build/score.md >> "$GITHUB_STEP_SUMMARY"
      - name: Walk the PGO corpus
        continue-on-error: true
        run: |
          [ -f build/pgo/pgo.pdb ] || exit 0
          llvm-pdbutil dump --symbols build/pgo/pgo.pdb | grep -o 'S_SEPCODE\|S_CALLERS\|S_CALLEES\|S_INLINEES\|S_POGODATA' | sort | uniq -c
          real=$(cygpath -u "$MSDIA_DLL")
          mkdir -p build/pgo/only && cp build/pgo/pgo.pdb build/pgo/only/
          walker/run_corpus.sh "$real" build/pgo/only build/pgo-real
          walker/run_corpus.sh "$(cygpath -m build/msdia140.dll)" build/pgo/only build/pgo-ours
          python3 tools/diff_walk.py --dirs build/pgo-real build/pgo-ours --top 20 | tee build/pgo-score.txt
      - name: Undecorated names
        run: |
          real=$(cygpath -u "$MSDIA_DLL")
          pdbs=(build/names/*.pdb build/corpus/*.pdb)
          build/name_probe.exe dia "$real" "${pdbs[@]}" > build/names-real.json
          build/name_probe.exe dia "$(cygpath -m build/msdia140.dll)" "${pdbs[@]}" > build/names-ours.json ||
            echo "{}" > build/names-ours.json
          python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))))' build/names-real.json > build/names.txt
          build/name_probe.exe dbghelp build/names.txt > build/names-dbghelp.json
          python3 tools/undname_test.py build/names-real.json build/names-ours.json --top 3 \
            --markdown build/names-score.md --json build/names-score.json | tee build/names-score.txt
          cat build/names-score.md >> "$GITHUB_STEP_SUMMARY"
      - name: loadDataForExe
        run: |
          real=$(cygpath -u "$MSDIA_DLL")
          ours=$(cygpath -m build/msdia140.dll)
          pairs=()
          for n in c_basic cpp_more_x86 msvc_c_basic msvc_cpp_more_x86; do
            [ -f build/corpus/$n.exe ] || continue
            for w in real ours; do
              dll=$real; [ $w = ours ] && dll=$ours
              rm -rf /c/ep; mkdir -p /c/ep
              build/exe_probe.exe "$dll" build/corpus/$n.exe build/corpus/$n.pdb build/corpus/c_more.pdb C:/ep \
                > build/exeload-$w-$n.json || echo '{}' > build/exeload-$w-$n.json
            done
            pairs+=(build/exeload-real-$n.json build/exeload-ours-$n.json)
          done
          python3 tools/exeload_test.py --markdown build/exeload-score.md "${pairs[@]}" | tee build/exeload-score.txt
          cat build/exeload-score.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmsdia-amd64
          path: |
            build/msdia140.dll
            build/dia_walk.exe
            build/call_probe.exe
            build/corpus/*.pdb
            build/real/
            build/ours/
            build/score.*
            build/names-*
            build/exeload-*
            build/pgo-*
            build/pgo/only/*.pdb
            build/names/*.pdb

  # Microsoft's public PDBs of the runner's Windows binaries, fetched from
  # the public symbol server (cached, never committed), walked with the
  # runner's real msdia140.dll and with ours. Reported on its own, apart
  # from the corpus score.
  mspdb:
    needs: amd64
    if: always()
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-python
      - uses: actions/download-artifact@v4
        with:
          name: openmsdia-amd64
          path: build
      - name: Locate the DIA SDK and the binaries
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dll = Join-Path $vs "DIA SDK\bin\amd64\msdia140.dll"
          "MSDIA_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bins = @()
          foreach ($n in 'ntdll','kernel32','kernelbase','user32','combase','ucrtbase','d3d11','mshtml') { $bins += "$env:SystemRoot\System32\$n.dll" }
          foreach ($n in 'ntdll','kernel32','user32') { $bins += "$env:SystemRoot\SysWOW64\$n.dll" }
          $bins = $bins | Where-Object { Test-Path $_ }
          $vers = $bins | ForEach-Object { "$_=" + (Get-Item $_).VersionInfo.FileVersion }
          $vers
          $hash = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($vers -join ';'))).Replace('-','').Substring(0,16)
          "MSPDB_KEY=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MS_BINARIES=" + (($bins | ForEach-Object { $_ -replace '\\','/' }) -join ' ') | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/cache@v6
        with:
          path: build/mspdb
          key: mspdb-${{ env.MSPDB_KEY }}
      - name: Fetch the public PDBs
        run: python3 tools/fetch_ms_pdbs.py build/mspdb $MS_BINARIES || true
      - name: Walk with the real DLL and with ours
        run: |
          real=$(cygpath -u "$MSDIA_DLL")
          ours=$(cygpath -m build/msdia140.dll)
          mkdir -p build/ms-real build/ms-ours
          for pdb in build/mspdb/*.pdb; do
            n=$(basename "$pdb" .pdb)
            for w in real ours; do
              dll=$real; [ $w = ours ] && dll=$ours
              ( build/dia_walk.exe "$dll" "$(cygpath -m "$pdb")" --map "$(cygpath -m "$PWD/build/mspdb")=<CORPUS>" \
                  > build/ms-$w/$n.json 2> build/ms-$w/$n.err || echo "$n $w: exit $?" ) &
            done
          done
          wait
          ls -la build/ms-real build/ms-ours
      - name: Score
        run: |
          python3 tools/diff_walk.py --dirs build/ms-real build/ms-ours --top 40 \
            --json build/ms-score.json --markdown build/ms-score.md | tee build/ms-score.txt
          for f in build/ms-real/*.json; do
            n=$(basename "$f" .json)
            echo "== $n"; python3 tools/diff_walk.py "$f" build/ms-ours/$n.json --top 0 | head -2
          done | tee build/ms-score-each.txt
          { echo "### Microsoft public PDBs"; cat build/ms-score.md; echo '```'; cat build/ms-score-each.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmsdia-mspdb
          retention-days: 7
          path: |
            build/ms-real/
            build/ms-ours/
            build/ms-score*

  # Real DIA consumers, run with the runner's msdia140.dll and with ours
  # (registration-free COM, see tools/consumers.sh): Ghidra's PDB exporter
  # (pdb.exe, Apache-2.0, built from Ghidra's sources) and the DIA SDK's
  # Dia2Dump sample (built from the runner's Visual Studio; used as a black
  # box, nothing of it is committed or uploaded). Their text outputs are
  # compared line by line.
  consumers:
    needs: amd64
    if: always()
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            diffutils
            git
            mingw-w64-clang-x86_64-python
      - uses: actions/download-artifact@v4
        with:
          name: openmsdia-amd64
          path: build
      - name: Locate the DIA SDK
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          "MSDIA_DLL=" + (Join-Path $vs "DIA SDK\bin\amd64\msdia140.dll") | Out-File -FilePath $env:GITHUB_ENV -Append
          "VS_PATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Fetch Ghidra's PDB exporter sources
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/NationalSecurityAgency/ghidra ../ghidra
          git -C ../ghidra sparse-checkout set Ghidra/Features/PDB/src/pdb
          git -C ../ghidra log -1 --format='Ghidra %H %cs'
      - name: Build the consumers
        shell: pwsh
        run: |
          Import-Module (Join-Path $env:VS_PATH 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $env:VS_PATH -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $dia = Join-Path $env:VS_PATH 'DIA SDK'
          New-Item -ItemType Directory -Force build\consumers | Out-Null
          $src = Resolve-Path ..\ghidra\Ghidra\Features\PDB\src\pdb
          Push-Location build\consumers
          cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE /I "$src\headers" /I "$dia\include" (Get-ChildItem "$src\cpp\*.cpp").FullName `
             /Fe:pdb.exe /link /MANIFEST:NO "$dia\lib\amd64\diaguids.lib" ole32.lib oleaut32.lib
          New-Item -ItemType Directory -Force d2d | Out-Null
          Copy-Item "$dia\Samples\DIA2Dump\*" d2d -Recurse
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE /I d2d /I "$dia\include" (Get-ChildItem d2d\*.cpp).FullName `
             /Fe:Dia2Dump.exe /link /MANIFEST:NO "$dia\lib\amd64\diaguids.lib" ole32.lib oleaut32.lib
          Pop-Location
          Get-ChildItem build\consumers\*.exe
      - name: Fetch Microsoft PDBs
        run: |
          python3 tools/fetch_ms_pdbs.py build/mspdb /c/Windows/System32/{ntdll,kernel32,user32,ucrtbase}.dll /c/Windows/SysWOW64/kernel32.dll || true
      - name: Run the consumers with the real DLL and with ours
        run: |
          pdbs=(build/corpus/c_basic.pdb build/corpus/cpp_classes.pdb build/corpus/cpp_more_O2.pdb build/corpus/cpp_more_x86.pdb
                build/corpus/msvc_cpp_classes.pdb build/corpus/msvc_cpp_more_O2.pdb build/corpus/msvc_features.pdb
                build/corpus/msvc_cpp_more_x86.pdb build/mspdb/*.pdb)
          ls -la "${pdbs[@]}" || true
          tools/consumers.sh "$(cygpath -u "$MSDIA_DLL")" build/msdia140.dll build/cons \
            build/consumers/pdb.exe build/consumers/Dia2Dump.exe -- "${pdbs[@]}"
          python3 tools/consumer_diff.py build/cons pdb Dia2Dump --markdown build/cons/score.md | tee build/cons/score.txt
          { echo "### DIA consumers (real msdia140 vs OpenMSDIA)"; cat build/cons/score.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Call patterns of the consumers (call_probe)
        if: always()
        run: |
          mkdir -p build/cons/probe
          pairs=()
          for p in build/corpus/*.pdb; do
            n=$(basename "$p" .pdb)
            build/call_probe.exe "$(cygpath -u "$MSDIA_DLL")" "$(cygpath -m "$p")" > build/cons/probe/$n.real.json || continue
            build/call_probe.exe "$(cygpath -m build/msdia140.dll)" "$(cygpath -m "$p")" > build/cons/probe/$n.ours.json || echo '{}' > build/cons/probe/$n.ours.json
            pairs+=(build/cons/probe/$n.real.json build/cons/probe/$n.ours.json)
          done
          python3 tools/probe_diff.py "${pairs[@]}" --top 3 | tee build/cons/probe-score.txt
          { echo '```'; head -40 build/cons/probe-score.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmsdia-consumers
          retention-days: 7
          path: |
            build/cons/pdb/
            build/cons/Dia2Dump/
            build/cons/probe/
            build/cons/probe-score.txt
            build/cons/score.*
